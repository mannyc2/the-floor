name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

env:
  ALCHEMY_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:leaf
      - run: bun run build
      - run: bun run test:native
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run test:flow
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: local-flow-${{ github.run_id }}
          path: work/flows/
          retention-days: 7
          if-no-files-found: ignore

  preview:
    needs: check
    # Enabled only after the hosted spike, account allowance, and admin-token
    # checks are evidenced. Fork code never receives deployment credentials.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.FLOOR_PREVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: floor-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: write
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # This read occurs inside the same concurrency group as cleanup. A queued
      # deployment therefore cannot recreate a preview after its PR closes.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: current
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.issue.number });
            core.setOutput('deploy', String(pr.state === 'open' && pr.head.sha === context.payload.pull_request.head.sha));
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.current.outputs.deploy == 'true'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.current.outputs.deploy == 'true'
        with:
          bun-version: 1.4.0
      - if: steps.current.outputs.deploy == 'true'
        run: bun install --frozen-lockfile
      - if: steps.current.outputs.deploy == 'true'
        run: bun run build
      - name: Deploy preview
        id: deploy
        if: steps.current.outputs.deploy == 'true'
        run: bun run preview --stage "$STAGE"
      - if: steps.current.outputs.deploy == 'true'
        run: bunx --no-install playwright install --with-deps chromium
      - name: Verify production entry on preview
        if: steps.current.outputs.deploy == 'true'
        run: |
          export FLOOR_FLOW_URL="$(jq -er '.url' work/ci/preview.json)"
          export FLOOR_FLOW_REMOTE=true
          bun run test:flow
      - name: Publish preview link
        if: steps.current.outputs.deploy == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const { url } = JSON.parse(fs.readFileSync('work/ci/preview.json', 'utf8'));
            const marker = '<!-- floor-preview -->';
            const body = `${marker}\nPreview: [The Floor](${url})\n\nThe production-entry connection flow passed. Renderer, look, and phone acceptance remain pending their recorded gates.`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: context.issue.number });
            const previous = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (previous) await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
      - name: Tear down a failed or cancelled preview attempt
        if: ${{ always() && steps.deploy.outcome != 'skipped' && (failure() || cancelled()) }}
        run: bun run preview:destroy --stage "$STAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: preview-flow-${{ github.run_id }}
          path: |
            work/flows/
            work/ci/preview.json
          retention-days: 7
          if-no-files-found: ignore
