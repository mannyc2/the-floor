name: Cleanup preview

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      stage:
        description: 'Preview to clean up (pr-<number> only)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    if: vars.FLOOR_PREVIEW_CONFIGURED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: floor-preview-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || inputs.stage }}
      cancel-in-progress: false
      queue: max
    env:
      STAGE: ${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || inputs.stage }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_TELEMETRY_DISABLED: '1'
    steps:
      # pull_request_target executes only the trusted base checkout. Never check
      # out the PR head in a cleanup job that receives account credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run preview:destroy --stage "$STAGE"
