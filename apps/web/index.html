<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Floor</title>
    <link rel="icon" href="data:," />
    <style>
      html, body, #root { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
      .floor-shell, #floor-map, .map-shell, .map { position: absolute; inset: 0; }
      .map canvas { display: block; outline: none; }
      .camera-rotation { position: fixed; top: 1rem; right: 1rem; z-index: 2; display: flex; gap: .25rem; }
      .floor-heading { position: fixed; left: 1rem; top: 0; z-index: 2; pointer-events: none; }
      .floor-connection { position: fixed; right: 1rem; bottom: 1rem; z-index: 2; }
      .floor-heading h1 { font-size: 1rem; }
      #status { position: fixed; left: 1rem; bottom: 1rem; max-width: 55%; font-size: .75rem; }
      .map-status { position: absolute; left: 1rem; bottom: 3rem; font-size: .75rem; }
      .world-status { position: absolute; left: 1rem; top: 5rem; max-width: 24rem; max-height: calc(100% - 10rem); overflow-y: auto; font-size: .8rem; }
      .world-status p { margin: 0 0 .5rem; }
      .world-status button { margin: 0 .5rem .5rem 0; }
      .world-floors { margin-bottom: .5rem; }
      .world-floors [aria-current="location"] { font-weight: bold; }
      .desk-drawer { position: absolute; top: 4rem; right: 0; bottom: 5rem; width: 20rem; padding: 1.25rem; overflow-y: auto; overflow-wrap: anywhere; background: var(--floor-paper); color: var(--floor-ink); }
      .desk-drawer h2 { font-size: 1.1rem; }
      .desk-drawer h3 { font-size: 1rem; }
      .desk-drawer dt { margin-top: .75rem; font-weight: bold; font-size: .8rem; }
      .desk-drawer dd { margin: .25rem 0 0; font-size: .8rem; }
      .desk-drawer p { font-size: .85rem; }
      .has-drawer .map { right: 23rem; }
      @media (max-width: 48rem) {
        .desk-drawer { top: auto; left: 0; width: auto; bottom: 0; height: 35%; }
        .has-drawer .map { right: 0; bottom: 40%; }
        .has-drawer .map-status, .has-drawer .world-status { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
