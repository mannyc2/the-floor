<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="icon" href="data:," />
    <title>The Floor workbench</title>
    <style>
      html, body, #root, .shell { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
      .map { position: absolute; inset: 0; }
      .map canvas { display: block; outline: none; }
      .camera-rotation { position: fixed; top: 2.75rem; right: 1rem; z-index: 2; display: flex; gap: .25rem; }
      #controls { position: fixed; left: 8px; top: 8px; display: flex; gap: 4px; z-index: 2; }
      #controls button { font: 12px system-ui; padding: 5px; }
      #status { position: fixed; left: 8px; bottom: 8px; font: 10px monospace; pointer-events: none; z-index: 2; }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="/workbench/entry.ts"></script></body>
</html>
